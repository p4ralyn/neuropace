[project]
name = "neuropace"
version = "0.1.0"
description = "EEG-based post-surgical patient monitoring"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = ["tensorflow>=2.19", "matplotlib>=3.8", "xgboost>=2.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
neuropace-train = "neuropace.train:main"
neuropace-eval = "neuropace.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuropace*"]

[tool.ruff]
line-length = 88
target-version = "py311"
# docs/ holds design and plan records; their embedded snippets are history,
# not source, and should not be rewritten by the formatter.
exclude = ["app", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
