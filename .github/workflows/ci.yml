name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: lint and TF-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock here -- the package installs from pyproject.toml, and
          # the action's default cache key globs for a lockfile that is absent.
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests that need no TensorFlow
        run: >
          uv run pytest
          tests/test_config.py
          tests/test_dataset.py
          tests/test_features.py
          -v

  full:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock here -- the package installs from pyproject.toml, and
          # the action's default cache key globs for a lockfile that is absent.
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev,train,api]"
      - run: uv run pytest -v

  app:
    name: app bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
